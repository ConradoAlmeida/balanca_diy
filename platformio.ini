[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
lib_deps =
    bogde/HX711@^0.7.5
    olikraus/U8g2@^2.36.5
    bblanchon/ArduinoJson @ ^7.3.0
    links2004/WebSockets @ ^2.6.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
