<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balanca DIY - OTA Update</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #00d4ff;
            --text: #eaeaea;
            --text2: #a0a0a0;
            --border: #2a2a4a;
            --success: #00c853;
            --danger: #ff1744;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 5px;
        }
        .header p {
            color: var(--text2);
            font-size: 0.9rem;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h2 span {
            font-size: 1.3rem;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text2);
            font-size: 0.85rem;
        }
        .form-group input[type="file"] {
            width: 100%;
            padding: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
        }
        .form-group input[type="file"]::file-selector-button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: var(--bg);
        }
        .btn-primary:hover {
            background: #00b8d9;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .progress-container {
            display: none;
            margin-top: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            text-align: center;
            margin-top: 8px;
            color: var(--text2);
            font-size: 0.85rem;
        }
        .status {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
        }
        .status.success {
            display: block;
            background: rgba(0, 200, 83, 0.15);
            border: 1px solid var(--success);
            color: var(--success);
        }
        .status.error {
            display: block;
            background: rgba(255, 23, 68, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
        }
        .info {
            text-align: center;
            color: var(--text2);
            font-size: 0.8rem;
            margin-top: 20px;
        }
        .info a {
            color: var(--accent);
            text-decoration: none;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ OTA Update</h1>
            <p>Balanca DIY - Firmware & Filesystem</p>
        </div>

        <div class="card">
            <h2><span>📦</span> Firmware (.bin)</h2>
            <form id="firmwareForm" method="POST" action="/update" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="firmware">Selecione o arquivo .bin do firmware</label>
                    <input type="file" id="firmware" name="firmware" accept=".bin" required>
                </div>
                <button type="submit" class="btn btn-primary" id="fwBtn">Upload Firmware</button>
            </form>
        </div>

        <div class="card">
            <h2><span>📁</span> Filesystem (LittleFS)</h2>
            <form id="fsForm" method="POST" action="/update" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="filesystem">Selecione o arquivo .bin do filesystem</label>
                    <input type="file" id="filesystem" name="filesystem" accept=".bin" required>
                </div>
                <button type="submit" class="btn btn-primary" id="fsBtn">Upload Filesystem</button>
            </form>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Enviando...</div>
        </div>

        <div id="status" class="status"></div>

        <div class="info">
            <p>Firmware: <code>.pio/build/esp32dev/firmware.bin</code></p>
            <p>Filesystem: gerado com <code>pio run -t buildfs</code></p>
            <a href="/" class="back-link">← Voltar para a página principal</a>
        </div>
    </div>

    <script>
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const btn = form.querySelector('button');
                const progressContainer = document.getElementById('progressContainer');
                const progressFill = document.getElementById('progressFill');
                const progressText = document.getElementById('progressText');
                const status = document.getElementById('status');

                btn.disabled = true;
                progressContainer.style.display = 'block';
                status.className = 'status';
                status.style.display = 'none';
                progressFill.style.width = '0%';

                try {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', '/update');

                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const pct = Math.round((e.loaded / e.total) * 100);
                            progressFill.style.width = pct + '%';
                            progressText.textContent = `Enviando... ${pct}%`;
                        }
                    });

                    xhr.addEventListener('load', () => {
                        progressFill.style.width = '100%';
                        progressText.textContent = 'Processando...';

                        if (xhr.status === 200) {
                            status.className = 'status success';
                            status.textContent = '✅ Update concluído! O ESP32 irá reiniciar.';
                            status.style.display = 'block';
                        } else {
                            status.className = 'status error';
                            status.textContent = '❌ Erro no update: ' + xhr.statusText;
                            status.style.display = 'block';
                        }
                        btn.disabled = false;
                    });

                    xhr.addEventListener('error', () => {
                        status.className = 'status error';
                        status.textContent = '❌ Erro de conexão';
                        status.style.display = 'block';
                        btn.disabled = false;
                    });

                    xhr.send(formData);
                } catch (err) {
                    status.className = 'status error';
                    status.textContent = '❌ Erro: ' + err.message;
                    status.style.display = 'block';
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
